{% extends 'base.html' %}

{% block title %}Дебати · Сесія {{ session.id }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Дебати щодо генерації тем</h2>
    <p class="text-muted">Спеціальність: {{ session.specialty }} | Кіл: {{ session.rounds }}</p>

    <div id="chat-container" class="border rounded p-3 mb-3 bg-light" style="height: 500px; overflow-y: auto;">
        <div class="text-center text-muted mt-5" id="empty-state">
            Натисніть кнопку нижче, щоб почати генерацію
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <button id="start-btn" class="btn btn-success btn-lg" onclick="startDebate(1)">Почати коло 1</button>
        <div id="status-text" class="text-primary fw-bold"></div>
    </div>
</div>

<script>
    const totalRounds = parseInt("{{ session.rounds }}") || 1;
    const sessionId = "{{ session.id }}";

    function appendMessage(sender, text, bgClass, icon = "") {
        const chat = document.getElementById('chat-container');
        const empty = document.getElementById('empty-state');
        if (empty) empty.style.display = 'none';

        const msg = document.createElement('div');
        msg.className = `mb-3 p-3 rounded shadow-sm ${bgClass}`;

        const header = document.createElement('strong');
        header.textContent = `${icon} ${sender}:`;

        const content = document.createElement('div');
        content.style.whiteSpace = "pre-wrap";
        content.textContent = text;

        msg.appendChild(header);
        msg.appendChild(content);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    function startDebate(roundNo) {
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        document.getElementById('status-text').innerText = 'З\'єднання...';

        const eventSource = new EventSource(`/session/${sessionId}/stream/?round=${roundNo}`);

        eventSource.onmessage = function(event) {
            // Логування в консоль браузера (F12 → Console)
            try {
                const parsed = JSON.parse(event.data);
                console.log(`%c[SSE] ${parsed.type}`, 'color: #0a0; font-weight: bold;', parsed);
            } catch (e) {
                console.warn('[SSE] raw (не JSON):', event.data);
            }

            try {
                const data = JSON.parse(event.data);

                if (data.type === 'status') {
                    document.getElementById('status-text').innerText = data.text;

                } else if (data.type === 'generator_topics') {
                    let text = `Я (${data.provider}) пропоную такі теми:\n`;
                    data.topics.forEach((t, i) => {
                        text += `${i + 1}. ${t.title}\n   ${t.why || ''}\n`;
                    });
                    appendMessage('Генератор', text, 'bg-primary text-white', '🤖');

                } else if (data.type === 'critic_scores') {
                    let text = `Мій аналіз (${data.provider}):\n`;
                    data.scores.forEach(s => {
                        const verdictLabel = {
                            'keep': '✅ Залишити',
                            'revise': '🔧 Доопрацювати',
                            'drop': '❌ Відкинути'
                        }[s.verdict] || s.verdict || '—';

                        text += `\nТема ${s.id}: ${verdictLabel}`;
                        if (s.score !== undefined) text += ` (${s.score}/10)`;
                        if (s.problems) text += `\n   Проблеми: ${s.problems}`;
                    });
                    appendMessage('Критик', text, 'bg-warning text-dark', '🧐');

                } else if (data.type === 'error') {
                    appendMessage('Помилка', data.text, 'bg-danger text-white', '❌');
                    eventSource.close();
                    btn.disabled = false;

                } else if (data.type === 'round_done') {
                    document.getElementById('status-text').innerText = `Коло ${roundNo} завершено!`;
                    eventSource.close();

                    if (roundNo < totalRounds) {
                        btn.disabled = false;
                        btn.innerText = `Почати коло ${roundNo + 1}`;
                        btn.onclick = function() { startDebate(roundNo + 1); };
                    } else {
                        document.getElementById('status-text').innerText = 'Усі кола завершено!';
                        btn.disabled = false;
                        btn.innerText = 'Переглянути історію';
                        btn.className = 'btn btn-primary btn-lg';
                        btn.onclick = function() {
                            window.location.href = `/session/${sessionId}/history/`;
                        };
                    }
                }
            } catch (e) {
                console.error("Помилка обробки SSE:", e);
            }
        };

        eventSource.onerror = function() {
            document.getElementById('status-text').innerText = 'Помилка з\'єднання.';
            eventSource.close();
            btn.disabled = false;
        };
    }
</script>
{% endblock %}
