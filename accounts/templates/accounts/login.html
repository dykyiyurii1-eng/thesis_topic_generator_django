{% extends 'base.html' %}

{% block title %}Вхід · THESIS_GEN{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-brutal">
            <span class="tech-index">AUTH.01 // LOGIN</span>
            <h2 class="mb-4">ВХІД ДО СИСТЕМИ</h2>
            
            {% if form.errors %}
                <div class="alert alert-danger rounded-0 border-dark">
                    НЕПРАВИЛЬНИЙ ЛОГІН АБО ПАРОЛЬ
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">ІМ'Я КОРИСТУВАЧА</label>
                    <input type="text" name="username" class="form-control rounded-0 border-dark" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">ПАРОЛЬ</label>
                    <input type="password" name="password" class="form-control rounded-0 border-dark" required>
                </div>
                <button type="submit" class="btn-brutal btn-brutal-black w-100">УВІЙТИ</button>
            </form>
            
            <div class="separator"></div>
            <div class="text-center small">
                НЕМАЄ АКАУНТУ? <a href="{% url 'accounts:register' %}" class="fw-bold">[ ЗАРЕЄСТРУВАТИСЯ ]</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
